<svg xmlns="http://www.w3.org/2000/svg" width="800" height="52" viewBox="0 0 800 52" role="img"><title>Full-stack developer — Web, mobile and APIs</title><desc>Animated typing text: Building across the stack. Web. Mobile. APIs. Product first. Details matter.</desc><style>text{font:20px Consolas,monospace;fill:#60a5fa}.line{opacity:0}.a{animation:a 15s infinite}.b{animation:b 15s infinite}.c{animation:c 15s infinite}.reveal{animation:reveal 5s steps(32,end) infinite}.cursor{animation:blink .7s steps(1) infinite}@keyframes reveal{0%,100%{width:0}55%,85%{width:800px}}@keyframes a{0%,32.9%{opacity:1}33%,100%{opacity:0}}@keyframes b{0%,32.9%{opacity:0}33%,65.9%{opacity:1}66%,100%{opacity:0}}@keyframes c{0%,65.9%{opacity:0}66%,99.9%{opacity:1}100%{opacity:0}}@keyframes blink{50%{opacity:0}}@media(prefers-reduced-motion:reduce){.line,.reveal,.cursor{animation:none}.a{opacity:1}.reveal{width:800px}.cursor{display:none}}</style><defs><clipPath id="typing"><rect class="reveal" width="800" height="52"/></clipPath></defs><g clip-path="url(#typing)" text-anchor="middle"><text class="line a" x="400" y="34">Building across the stack.</text><text class="line b" x="400" y="34">Web. Mobile. APIs.</text><text class="line c" x="400" y="34">Product first. Details matter.</text></g></svg>